[project]
name = "marsense-backend"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Gautham Binoy", email = "gauthambinoy999@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.115",
    "geopandas>=1.2.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2",
    "pydantic-settings>=2.16.2",
    "pyproj>=3.8.0",
    "python-multipart>=0.0.33",
    "rasterio>=1.5.2",
    "reportlab>=5.1.0",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
marsense-backend = "marsense_backend:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "RUF007", "SIM117", "RUF012", "E731", "E501", "B905", "B007", "UP042", "RUF100"]

[tool.pytest.ini_options]
testpaths = ["tests"]
