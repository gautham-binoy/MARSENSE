# Render Blueprint Specification for MARSENSE
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: marsense
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: DATA_DIR
        value: /app/data
      - key: DATABASE_URL
        value: sqlite:////app/data/marsense.db
      - key: OFFLINE
        value: "false"
